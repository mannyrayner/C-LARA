<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Dictionaries</title>
  <meta name="description" content="Browse community picture dictionaries, or sign in to add and share words, pictures and audio.">
  <link rel="canonical" href="https://www.c-lara.org/d/">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid;
      place-items: center; padding: 1.5rem; background: #f3f6fa; color: #172d45;
      font: 1.125rem/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 28rem; }
    h1 { margin: 0 0 1rem; font-size: 2rem; line-height: 1.2; }
    p { margin: 0 0 1.5rem; }
    nav { display: grid; gap: 1rem; }
    a { display: block; padding: 1rem; border: 2px solid #24558a;
      border-radius: .5rem; color: #24558a; background: white;
      text-align: center; text-decoration: none; font-weight: 650; }
    a:first-child { background: #24558a; color: white; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 3px solid #b35b00; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Community Dictionaries</h1>
    <p>Pictures, voices and words, made together.</p>
    <nav aria-label="Choose how to use Community Dictionaries">
      <a href="https://c-lara-2.c-lara.org/community-dictionaries/browse/">Browse without signing in</a>
      <a href="https://c-lara-2.c-lara.org/community-dictionaries/">Sign in or register</a>
    </nav>
  </main>
</body>
</html>
